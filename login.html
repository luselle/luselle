
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Inicia sesión en Luselle y gestiona tus citas de belleza.">

    <title>Iniciar sesión | Luselle</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-page">

    <!-- Enlace para regresar -->
    <a class="back-home" href="index.html">
        ← Volver a Luselle
    </a>

    <main class="login-shell">

        <!-- Panel izquierdo -->
        <section class="login-brand">

            <a class="brand" href="index.html">
                <span class="brand-mark">L</span>
                <span>
                    Luselle<span class="brand-dot">.</span>
                </span>
            </a>

            <span class="eyebrow">
                TU ESPACIO PERSONAL
            </span>

            <h1>
                Qué bueno<br>
                tenerte <em>de vuelta.</em>
            </h1>

            <p>
                Ingresa para gestionar tus citas y disfrutar
                de tu experiencia Luselle.
            </p>

            <div class="login-decoration">
                ✿
            </div>

        </section>

        <!-- Panel derecho -->
        <section class="login-form">

            <div id="loginBox">

                <span class="eyebrow">
                    BIENVENIDO/A
                </span>

                <h2>Iniciar sesión</h2>

                <!-- Formulario -->
                <form id="loginForm">

                    <label for="usuario">
                        Usuario o correo electrónico
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Escribe tu usuario o correo"
                        autocomplete="username"
                        required
                    >

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Escribe tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="button button-primary login-submit"
                        type="submit"
                    >
                        Ingresar ↗
                    </button>

                    <!-- Mensajes del sistema -->
                    <p
                        class="form-note"
                        id="formMessage"
                        role="status"
                    ></p>

                </form>

                <!-- Registro -->
                <p class="login-help">
                    ¿Aún no tienes cuenta?

                    <a href="registro.html">
                        Crear cuenta de cliente
                    </a>
                </p>

            </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
